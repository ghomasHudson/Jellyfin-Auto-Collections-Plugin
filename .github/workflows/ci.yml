name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '9.0.x'
      - name: Install poster test fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-dejavu-core
      - name: Run tests in Release mode
        run: dotnet test MagicCollections.slnx -c Release

  commit-messages:
    name: Check commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Commitizen
        run: python -m pip install 'commitizen==4.20.1'
      - name: Validate PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range="$BASE_SHA..$HEAD_SHA"
          commit_count=$(git rev-list --count "$range")
          if [ "$commit_count" -eq 0 ]; then
            echo "No new commits to validate."
          else
            cz check --rev-range "$range"
          fi
