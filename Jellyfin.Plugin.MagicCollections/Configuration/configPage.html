<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Magic Collections</title></head>
<body>
    <div id="magicCollectionsPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-input">
        <style>
            #magicCollectionsUrls > .inputContainer:not(:last-child) {
                margin-bottom: .6em;
            }
            #magicCollectionsUrls .inputLabel {
                display: none;
            }
            #magicCollectionsUrls .sourceUrlStatus {
                display: grid;
                margin-top: .25em;
                font-size: .9em;
            }
            /* Reserve space for either message, including when it wraps. */
            #magicCollectionsUrls .sourceUrlStatus > * {
                grid-area: 1 / 1;
            }
            #magicCollectionsUrls .sourceUrlStatus > [aria-hidden="true"] {
                visibility: hidden;
            }
            /* The trailing input is blank and has no status to show. */
            #magicCollectionsUrls > :last-child .sourceUrlStatus {
                display: none;
            }
        </style>
        <div data-role="content">
            <div class="content-primary">
                <h1>Magic Collections</h1>
                <form>
                    <h3 id="magicCollectionsUrlsHeading">Source list URLs</h3>
                    <p class="fieldDescription">Add URLs for supported source lists.</p>
                    <div id="magicCollectionsUrls" role="group" aria-labelledby="magicCollectionsUrlsHeading"></div>
                    <button is="emby-button" type="submit" class="raised button-submit block"><span>Save</span></button>
                </form>
                <template id="magicCollectionsUrlRow">
                    <div class="inputContainer">
                        <input is="emby-input" type="text" inputmode="url" autocapitalize="off" spellcheck="false" placeholder="https://mdblist.com/lists/snoak/latest-movies-digital-release" />
                        <div class="fieldDescription sourceUrlStatus">
                            <span data-unsupported aria-hidden="true">This doesn’t look like a supported source list URL. You can still save it.</span>
                            <span data-check-failed aria-hidden="true">Could not check whether this URL is supported.</span>
                            <div role="status"></div>
                        </div>
                    </div>
                </template>
            </div>
        </div>
        <script>
            (() => {
                const pluginId = '3290c5ef-9e20-4cdf-ab34-87e9021bcc34';
                const page = document.querySelector('#magicCollectionsPage');
                const form = page.querySelector('form');
                const urls = page.querySelector('#magicCollectionsUrls');
                const template = page.querySelector('#magicCollectionsUrlRow');
                let nextStatusId = 0;

                // Jellyfin translates template placeholders in the whole page, including inline scripts.
                function urlLabel(index) {
                    return 'Source list URL ' + (index + 1);
                }

                function addUrl(value = '') {
                    const row = template.content.firstElementChild.cloneNode(true);
                    const input = row.querySelector('input');
                    const status = row.querySelector('[role="status"]');
                    const unsupportedMessage = row.querySelector('[data-unsupported]').textContent;
                    const failedMessage = row.querySelector('[data-check-failed]').textContent;
                    status.id = 'magicCollectionsUrlStatus' + (++nextStatusId);
                    input.setAttribute('aria-label', urlLabel(urls.children.length));
                    input.setAttribute('aria-describedby', status.id);
                    input.value = value;

                    let timer;
                    let inputRevision = 0;
                    async function checkUrl(url, requestRevision) {
                        let message;
                        try {
                            const supported = await ApiClient.ajax({
                                type: 'POST',
                                url: ApiClient.getUrl('MagicCollections/SourceListUrl'),
                                data: JSON.stringify({ Url: url }),
                                contentType: 'application/json',
                                dataType: 'json'
                            });
                            message = supported === false ? unsupportedMessage : '';
                        } catch {
                            message = failedMessage;
                        }
                        if (requestRevision === inputRevision && row.isConnected) {
                            status.textContent = message;
                        }
                    }

                    function scheduleUrlCheck(value) {
                        clearTimeout(timer);
                        const requestRevision = ++inputRevision;
                        status.textContent = '';
                        const url = value.trim();
                        if (!url) return;
                        timer = setTimeout(() => checkUrl(url, requestRevision), 400);
                    }

                    input.addEventListener('input', () => {
                        if (row === urls.lastElementChild && input.value.trim()) {
                            addUrl();
                        }
                        scheduleUrlCheck(input.value);
                    });
                    input.addEventListener('blur', () => {
                        if (row !== urls.lastElementChild && !input.value.trim()) {
                            row.remove();
                            urls.querySelectorAll('input').forEach((field, index) => field.setAttribute('aria-label', urlLabel(index)));
                        }
                    });
                    urls.appendChild(row);
                }

                function renderUrls(values) {
                    urls.textContent = '';
                    values.forEach(url => addUrl(url));
                    addUrl();
                }

                async function withConfiguration(action) {
                    Dashboard.showLoadingMsg();
                    try {
                        const config = await ApiClient.getPluginConfiguration(pluginId);
                        await action(config);
                    } finally {
                        Dashboard.hideLoadingMsg();
                    }
                }

                page.addEventListener('pageshow', () => withConfiguration(config => {
                    renderUrls(config.SourceUrls || []);
                }));
                // Keep a blank row from collapsing on blur before the Save click completes.
                form.querySelector('button[type="submit"]').addEventListener('mousedown', event => event.preventDefault());
                form.addEventListener('submit', event => {
                    event.preventDefault();
                    return withConfiguration(async config => {
                        config.SourceUrls = Array.from(urls.querySelectorAll('input'), input => input.value.trim()).filter(Boolean);
                        const result = await ApiClient.updatePluginConfiguration(pluginId, config);
                        renderUrls(config.SourceUrls);
                        Dashboard.processPluginConfigurationUpdateResult(result);
                    });
                });
            })();
        </script>
    </div>
</body>
</html>
